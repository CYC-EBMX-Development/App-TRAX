spring:
  datasource:
    url: jdbc:h2:mem:traxtest;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

server:
  port: 0

jwt:
  secret: test-secret-key-for-jwt-token-generation-min-256-bits-long-key-trax
  expiration: 3600000

google:
  maps:
    api-key: test-key

app:
  images:
    dir: ./build/test-images
