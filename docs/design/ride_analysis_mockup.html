<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TRAX · 骑行回放分析页 设计稿</title>
<style>
  :root{
    --bg:#0E1116; --panel:#171B22; --panel2:#1E232C; --line:#2A313C;
    --text:#E8ECF1; --text-dim:#8A94A3; --primary:#FFB800;
    --speed:#FF6B00; --alt:#2E7DF6; --track:#3A4150; --track-done:#FF6B00;
    --good:#36C77B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#05070A;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;}
  .frame{max-width:430px;margin:0 auto;height:100vh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;overflow:hidden;}

  /* ---- App bar ---- */
  .appbar{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);}
  .appbar .back{width:34px;height:34px;border-radius:50%;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;color:var(--text);font-size:18px;}
  .appbar .title{font-size:16px;font-weight:700;}
  .appbar .sub{font-size:11px;color:var(--text-dim);font-weight:500;margin-top:1px;}

  /* ---- Map (top) ---- */
  .map{position:relative;flex:0 0 42%;background:
    radial-gradient(1200px 500px at 30% -10%, #1b2330 0%, #11151c 60%, #0c0f15 100%);
    overflow:hidden;border-bottom:1px solid var(--line);}
  .map svg{position:absolute;inset:0;width:100%;height:100%;}
  .map .grid{stroke:#1b212b;stroke-width:1;}
  .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);
    backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;
    padding:6px 10px;font-size:11px;color:var(--text-dim);}
  .badge b{color:var(--text);}
  .pin{position:absolute;width:18px;height:18px;border-radius:50%;
    background:var(--primary);border:3px solid #fff;transform:translate(-50%,-50%);
    box-shadow:0 0 0 4px rgba(255,184,0,.25),0 2px 6px rgba(0,0,0,.5);pointer-events:none;}
  .flag{position:absolute;transform:translate(-50%,-100%);font-size:16px;pointer-events:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}

  /* ---- Scrubber ---- */
  .scrub-wrap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 12px;
    background:linear-gradient(180deg,rgba(8,10,14,0) 0%, rgba(8,10,14,.85) 45%);}
  .scrub-time{display:flex;justify-content:space-between;font-size:11px;
    color:var(--text-dim);margin-bottom:6px;font-variant-numeric:tabular-nums;}
  .scrub-time b{color:var(--text);}
  .scrub{position:relative;height:24px;display:flex;align-items:center;cursor:pointer;}
  .scrub .rail{position:absolute;left:0;right:0;height:5px;border-radius:3px;background:var(--track);}
  .scrub .done{position:absolute;left:0;height:5px;border-radius:3px;background:var(--track-done);}
  .scrub .knob{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
    border:3px solid var(--track-done);transform:translateX(-50%);box-shadow:0 2px 6px rgba(0,0,0,.5);}

  /* ---- Bottom analysis panel ---- */
  .panel{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  .metrics-row{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;}
  .chip{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:18px;
    background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;
    color:var(--text-dim);cursor:pointer;user-select:none;transition:.15s;}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;}
  .chip[data-k="speed"]{--c:var(--speed);} .chip[data-k="altitude"]{--c:var(--alt);}
  .chip.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 16%, var(--panel2));}
  .chip.on .dot{background:var(--c);}
  .chip.disabled{opacity:.4;pointer-events:none;}
  .multi-hint{margin-left:auto;font-size:10px;color:var(--text-dim);text-align:right;line-height:1.3;}

  .readout{display:flex;align-items:baseline;gap:10px;padding:2px 16px 6px;}
  .readout .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;}
  .readout .unit{font-size:14px;color:var(--text-dim);font-weight:600;}
  .readout .at{margin-left:auto;font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .readout .big.speed{color:var(--speed);} .readout .big.altitude{color:var(--alt);}

  /* chart */
  .chart-tools{display:flex;align-items:center;gap:8px;padding:2px 14px 6px;}
  .chart-tools .zhint{font-size:11px;color:var(--text-dim);}
  .chart-tools .spacer{flex:1;}
  .zbtn{width:30px;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .zbtn:active{background:var(--line);}
  .chart-host{position:relative;flex:1 1 auto;min-height:0;margin:0 6px 8px;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .tip{position:absolute;pointer-events:none;background:#fff;color:#0c0f15;font-size:12px;font-weight:700;
    padding:4px 8px;border-radius:7px;transform:translate(-50%,-130%);white-space:nowrap;
    box-shadow:0 4px 12px rgba(0,0,0,.4);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .1s;}
  .tip:after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#fff;}
  .legend-zoom{position:absolute;left:10px;top:8px;font-size:10px;color:var(--text-dim);
    background:rgba(0,0,0,.35);border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums;}

  .note{font-size:10px;color:var(--text-dim);padding:0 16px 10px;line-height:1.5;}
  .note code{color:var(--primary);}
</style>
</head>
<body>
<div class="frame">
  <!-- App bar -->
  <div class="appbar">
    <div class="back">‹</div>
    <div>
      <div class="title">骑行分析</div>
      <div class="sub">青山绿道 · 2026-06-08 · 时长 12:00</div>
    </div>
  </div>

  <!-- Map -->
  <div class="map" id="map">
    <svg id="mapSvg" preserveAspectRatio="none"></svg>
    <div class="badge">距离 <b id="bDist">0.0</b> km &nbsp;·&nbsp; 时刻 <b id="bTime">00:00</b></div>
    <div class="flag" id="flagStart">🟢</div>
    <div class="flag" id="flagEnd">🏁</div>
    <div class="pin" id="pin"></div>

    <div class="scrub-wrap">
      <div class="scrub-time"><span>00:00</span><span>当前 <b id="curTime">00:00</b></span><span>12:00</span></div>
      <div class="scrub" id="scrub">
        <div class="rail"></div>
        <div class="done" id="scrubDone"></div>
        <div class="knob" id="scrubKnob"></div>
      </div>
    </div>
  </div>

  <!-- Analysis panel -->
  <div class="panel">
    <div class="metrics-row" id="chips">
      <div class="chip on" data-k="speed"><span class="dot"></span>速度</div>
      <div class="chip" data-k="altitude"><span class="dot"></span>海拔</div>
      <div class="multi-hint">单选模式<br/>架构支持多选叠加</div>
    </div>

    <div class="readout">
      <span class="big speed" id="roVal">0.0</span>
      <span class="unit" id="roUnit">km/h</span>
      <span class="at">第 <b id="roIdx">1</b> / <span id="roTotal">120</span> 点</span>
    </div>

    <div class="chart-tools">
      <span class="zhint">双指缩放时间区间 · 点击/拖动移动竖线</span>
      <span class="spacer"></span>
      <div class="zbtn" id="zOut">−</div>
      <div class="zbtn" id="zIn">+</div>
    </div>

    <div class="chart-host" id="chartHost">
      <canvas id="chart"></canvas>
      <div class="legend-zoom" id="zoomInfo">显示全程 · 120 点</div>
      <div class="tip" id="tip"></div>
    </div>

    <div class="note">
      说明：竖线 = 当前时刻，与上方进度条/地图车点为<b>同一数据源</b>。最小可放大到 <code>10 个点</code>，
      最大为整段活动；总点数 ≤10 时禁止放大。当前指标为单选，<code>Set&lt;MetricKey&gt;</code> 架构可平滑放开为多选。
    </div>
  </div>
</div>

<script>
/* ---------------- Mock ride data ---------------- */
const N = 120;                 // 120 points
const STEP_MS = 6000;          // 6s each -> 12 min total
const T0 = Date.now() - N*STEP_MS;
const points = [];
(function gen(){
  let lat=22.5400, lng=114.0600;
  for(let i=0;i<N;i++){
    const ph=i/N;
    // speed: warmup -> cruise with hills -> sprint -> cooldown
    let sp = 14 + 26*Math.sin(ph*Math.PI) + 8*Math.sin(ph*22)*Math.exp(-Math.abs(ph-.55)*4);
    if(ph>.85) sp += (ph-.85)*120;            // final sprint
    sp = Math.max(0, sp + (Math.random()-.5)*2.5);
    // altitude: a climb then descent (rolling)
    let al = 30 + 70*Math.sin(ph*Math.PI*0.9) + 14*Math.sin(ph*9) + 6*Math.sin(ph*30);
    al = Math.max(5, al);
    // walk lat/lng to make a loopy track
    const ang = ph*Math.PI*4;
    lat += Math.cos(ang)*0.00035 + 0.00012;
    lng += Math.sin(ang)*0.00045 + 0.00010;
    points.push({ t:T0+i*STEP_MS, lat, lng, speed:+sp.toFixed(1), altitude:+al.toFixed(1) });
  }
})();

/* ---------------- Metric registry (multi-ready) ---------------- */
const METRICS = {
  speed:    { key:'speed',    label:'速度', unit:'km/h', color:'#FF6B00', cls:'speed',    sample:p=>p.speed },
  altitude: { key:'altitude', label:'海拔', unit:'m',    color:'#2E7DF6', cls:'altitude', sample:p=>p.altitude },
};
let selected = new Set(['speed']);     // single-select now; Set supports multi

/* ---------------- Single source of truth ---------------- */
let cursor = 0;                 // float index 0..N-1 (current moment)
let viewStart = 0, viewEnd = N-1;   // zoom window (point indices)
const MIN_SPAN = 9;             // min 10 points => span(end-start)=9

/* ---------------- Helpers ---------------- */
const $=id=>document.getElementById(id);
const fmt=ms=>{const s=Math.max(0,Math.round((ms-T0)/1000));const m=(s/60|0);const ss=s%60;
  return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');};
const lerp=(a,b,t)=>a+(b-a)*t;
function sampleAt(metric, idxF){
  const i=Math.max(0,Math.min(N-1,Math.floor(idxF)));
  const j=Math.min(N-1,i+1); const f=idxF-i;
  return lerp(metric.sample(points[i]), metric.sample(points[j]), f);
}
function posAt(idxF){
  const i=Math.max(0,Math.min(N-1,Math.floor(idxF)));
  const j=Math.min(N-1,i+1); const f=idxF-i;
  return { lat:lerp(points[i].lat,points[j].lat,f), lng:lerp(points[i].lng,points[j].lng,f) };
}

/* ---------------- Map rendering ---------------- */
let mapBox=null;
function mapBounds(){
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const p of points){a=Math.min(a,p.lat);b=Math.max(b,p.lat);c=Math.min(c,p.lng);d=Math.max(d,p.lng);}
  return {minLat:a,maxLat:b,minLng:c,maxLng:d};
}
const MB=mapBounds();
function toXY(lat,lng,W,H){
  const pad=26;
  const x=pad+(lng-MB.minLng)/(MB.maxLng-MB.minLng)*(W-2*pad);
  const y=H-pad-(lat-MB.minLat)/(MB.maxLat-MB.minLat)*(H-2*pad);
  return [x,y];
}
function drawMap(){
  const svg=$('mapSvg'); const r=$('map').getBoundingClientRect();
  const W=r.width,H=r.height; mapBox={W,H};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let g='';
  for(let i=0;i<=6;i++){const y=i/6*H; g+=`<line class="grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;}
  for(let i=0;i<=5;i++){const x=i/5*W; g+=`<line class="grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;}
  let full='', done='';
  points.forEach((p,i)=>{const [x,y]=toXY(p.lat,p.lng,W,H); full+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';});
  const ci=Math.floor(cursor);
  for(let i=0;i<=ci;i++){const [x,y]=toXY(points[i].lat,points[i].lng,W,H); done+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';}
  svg.innerHTML=g+
    `<path d="${full}" fill="none" stroke="#3A4150" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`+
    `<path d="${done}" fill="none" stroke="#FF6B00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  const [sx,sy]=toXY(points[0].lat,points[0].lng,W,H);
  const [ex,ey]=toXY(points[N-1].lat,points[N-1].lng,W,H);
  $('flagStart').style.left=sx+'px'; $('flagStart').style.top=sy+'px';
  $('flagEnd').style.left=ex+'px';   $('flagEnd').style.top=ey+'px';
  const pp=posAt(cursor); const [px,py]=toXY(pp.lat,pp.lng,W,H);
  $('pin').style.left=px+'px'; $('pin').style.top=py+'px';
}

/* ---------------- Scrubber ---------------- */
function syncScrub(){
  const pct=cursor/(N-1)*100;
  $('scrubDone').style.width=pct+'%';
  $('scrubKnob').style.left=pct+'%';
  $('curTime').textContent=fmt(points[Math.round(cursor)].t);
  $('bTime').textContent=fmt(points[Math.round(cursor)].t);
  // cumulative distance up to cursor
  let km=0; const ci=Math.floor(cursor);
  for(let i=1;i<=ci;i++){km+=haversine(points[i-1],points[i]);}
  $('bDist').textContent=km.toFixed(2);
}
function haversine(a,b){
  const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function scrubFromClientX(cx){
  const r=$('scrub').getBoundingClientRect();
  let pct=(cx-r.left)/r.width; pct=Math.max(0,Math.min(1,pct));
  setCursor(pct*(N-1));
}
(function bindScrub(){
  const el=$('scrub'); let drag=false;
  const down=e=>{drag=true; scrubFromClientX((e.touches?e.touches[0]:e).clientX); e.preventDefault();};
  const move=e=>{if(drag) scrubFromClientX((e.touches?e.touches[0]:e).clientX);};
  const up=()=>drag=false;
  el.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  el.addEventListener('touchstart',down,{passive:false}); el.addEventListener('touchmove',move,{passive:false}); el.addEventListener('touchend',up);
})();

/* ---------------- Readout ---------------- */
function syncReadout(){
  const m=METRICS[[...selected][0]];
  const v=sampleAt(m,cursor);
  const el=$('roVal'); el.textContent=v.toFixed(1); el.className='big '+m.cls;
  $('roUnit').textContent=m.unit;
  $('roIdx').textContent=Math.round(cursor)+1; $('roTotal').textContent=N;
}

/* ---------------- Chart ---------------- */
const cv=$('chart'), ctx=cv.getContext('2d');
function resizeChart(){
  const r=$('chartHost').getBoundingClientRect(); const dpr=devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  return {W:r.width,H:r.height};
}
function drawChart(){
  const {W,H}=resizeChart();
  ctx.clearRect(0,0,W,H);
  const padL=8,padR=8,padT=14,padB=20;
  const x0=padL,x1=W-padR,y0=padT,y1=H-padB;
  const span=viewEnd-viewStart;
  const idxToX=i=>x0+(i-viewStart)/span*(x1-x0);
  const xToIdx=x=>viewStart+(x-x0)/(x1-x0)*span;

  // grid
  ctx.strokeStyle='#222934'; ctx.lineWidth=1; ctx.beginPath();
  for(let k=0;k<=4;k++){const y=y0+(y1-y0)*k/4; ctx.moveTo(x0,y); ctx.lineTo(x1,y);} ctx.stroke();

  // each selected metric (multi-ready: own y-range, own color)
  const metrics=[...selected].map(k=>METRICS[k]);
  metrics.forEach(m=>{
    let mn=1e9,mx=-1e9;
    for(let i=Math.floor(viewStart);i<=Math.ceil(viewEnd);i++){const v=m.sample(points[i]); mn=Math.min(mn,v); mx=Math.max(mx,v);}
    const pad=(mx-mn)*0.12||1; mn-=pad; mx+=pad;
    const valToY=v=>y1-(v-mn)/(mx-mn)*(y1-y0);
    // area
    ctx.beginPath();
    for(let i=Math.floor(viewStart);i<=Math.ceil(viewEnd);i++){const x=idxToX(i),y=valToY(m.sample(points[i])); i===Math.floor(viewStart)?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.lineTo(idxToX(Math.ceil(viewEnd)),y1); ctx.lineTo(idxToX(Math.floor(viewStart)),y1); ctx.closePath();
    const grad=ctx.createLinearGradient(0,y0,0,y1); grad.addColorStop(0,m.color+'55'); grad.addColorStop(1,m.color+'05');
    ctx.fillStyle=grad; ctx.fill();
    // line
    ctx.beginPath(); ctx.lineWidth=2.4; ctx.strokeStyle=m.color; ctx.lineJoin='round';
    for(let i=Math.floor(viewStart);i<=Math.ceil(viewEnd);i++){const x=idxToX(i),y=valToY(m.sample(points[i])); i===Math.floor(viewStart)?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();
    m._valToY=valToY; // stash for cursor dot
  });

  // cursor vertical line (only if in view)
  if(cursor>=viewStart-0.001 && cursor<=viewEnd+0.001){
    const cx=idxToX(cursor);
    ctx.beginPath(); ctx.strokeStyle='#E8ECF1'; ctx.lineWidth=1.5; ctx.setLineDash([4,4]);
    ctx.moveTo(cx,y0); ctx.lineTo(cx,y1); ctx.stroke(); ctx.setLineDash([]);
    // intersection dots
    metrics.forEach(m=>{
      const v=sampleAt(m,cursor); const cy=m._valToY(v);
      ctx.beginPath(); ctx.fillStyle=m.color; ctx.arc(cx,cy,5,0,7); ctx.fill();
      ctx.beginPath(); ctx.fillStyle='#fff'; ctx.arc(cx,cy,2.2,0,7); ctx.fill();
    });
    // value tip (primary metric)
    const m=metrics[0]; const v=sampleAt(m,cursor); const cy=m._valToY(v);
    const tip=$('tip'); tip.style.opacity='1';
    tip.textContent=v.toFixed(1)+' '+m.unit;
    tip.style.left=Math.max(34,Math.min(W-34,cx))+'px'; tip.style.top=cy+'px';
  } else { $('tip').style.opacity='0'; }

  // x-axis time labels
  ctx.fillStyle='#8A94A3'; ctx.font='10px -apple-system'; ctx.textAlign='center';
  for(let k=0;k<=4;k++){const i=viewStart+span*k/4; const x=idxToX(i); ctx.fillText(fmt(points[Math.round(i)].t),x,H-6);}
  $('zoomInfo').textContent = (span>=N-1?'显示全程':'已放大')+' · '+(Math.round(span)+1)+' 点';
}

/* chart pointer: click/drag moves cursor */
(function bindChart(){
  const host=$('chartHost'); let drag=false;
  const padL=8,padR=8;
  function moveCursor(cx){
    const r=host.getBoundingClientRect(); const W=r.width;
    const x0=padL,x1=W-padR; const span=viewEnd-viewStart;
    let idx=viewStart+(cx-r.left-x0)/(x1-x0)*span;
    setCursor(Math.max(0,Math.min(N-1,idx)));
  }
  host.addEventListener('mousedown',e=>{drag=true;moveCursor(e.clientX);});
  window.addEventListener('mousemove',e=>{if(drag)moveCursor(e.clientX);});
  window.addEventListener('mouseup',()=>drag=false);

  // touch: 1 finger = move cursor, 2 fingers = pinch zoom
  let pinch=null;
  host.addEventListener('touchstart',e=>{
    if(e.touches.length===1){drag=true;moveCursor(e.touches[0].clientX);}
    else if(e.touches.length===2){drag=false; pinch=startPinch(e);}
    e.preventDefault();
  },{passive:false});
  host.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinch){doPinch(e,pinch);}
    else if(e.touches.length===1&&drag){moveCursor(e.touches[0].clientX);}
    e.preventDefault();
  },{passive:false});
  host.addEventListener('touchend',e=>{drag=false; if(e.touches.length<2)pinch=null;});

  // wheel zoom (desktop preview of pinch)
  host.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=host.getBoundingClientRect(); const W=r.width; const x0=padL,x1=W-padR;
    const span=viewEnd-viewStart; const focus=viewStart+(e.clientX-r.left-x0)/(x1-x0)*span;
    zoomBy(e.deltaY>0?1.15:0.87, focus);
  },{passive:false});
})();

function startPinch(e){
  const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
  const host=$('chartHost').getBoundingClientRect();
  const midX=(e.touches[0].clientX+e.touches[1].clientX)/2;
  const span=viewEnd-viewStart; const focus=viewStart+(midX-host.left-8)/(host.width-16)*span;
  return {d0:Math.hypot(dx,dy), span0:span, start0:viewStart, focus};
}
function doPinch(e,p){
  const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
  const d=Math.hypot(dx,dy); const ratio=p.d0/d;       // fingers apart => zoom in
  zoomTo(p.span0*ratio, p.focus);
}
function zoomBy(factor,focus){ zoomTo((viewEnd-viewStart)*factor, focus); }
function zoomTo(newSpan, focus){
  const maxSpan=N-1;
  if(maxSpan<=MIN_SPAN){ flash('数据点过少，无法放大'); return; }
  newSpan=Math.max(MIN_SPAN,Math.min(maxSpan,newSpan));
  const fr=(focus-viewStart)/(viewEnd-viewStart);     // keep focus point under finger
  let s=focus-fr*newSpan, en=s+newSpan;
  if(s<0){s=0;en=newSpan;} if(en>N-1){en=N-1;s=en-newSpan;}
  viewStart=s; viewEnd=en;
  // keep cursor inside view
  cursor=Math.max(viewStart,Math.min(viewEnd,cursor));
  drawChart();
}
let flashT=null;
function flash(msg){const z=$('zoomInfo'); z.textContent=msg; clearTimeout(flashT);
  flashT=setTimeout(()=>drawChart(),1200);}

/* zoom buttons */
$('zIn').onclick=()=>zoomBy(0.6,(viewStart+viewEnd)/2);
$('zOut').onclick=()=>zoomBy(1.7,(viewStart+viewEnd)/2);

/* ---------------- Cursor setter = single source ---------------- */
function setCursor(idxF){
  cursor=Math.max(0,Math.min(N-1,idxF));
  drawMap(); syncScrub(); syncReadout(); drawChart();
}

/* ---------------- Metric chips (single-select, multi-ready) ---------------- */
$('chips').addEventListener('click',e=>{
  const chip=e.target.closest('.chip'); if(!chip||chip.classList.contains('disabled'))return;
  const k=chip.dataset.k;
  // SINGLE-SELECT rule: replace selection. (For multi: toggle in the Set.)
  selected=new Set([k]);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===k));
  syncReadout(); drawChart();
});

/* ---------------- Init ---------------- */
function init(){ setCursor(N*0.33); }
window.addEventListener('resize',()=>{drawMap();drawChart();syncScrub();});
setTimeout(init,40);
</script>
