name: tra_x

description: "TRAX for CYC"
# Version
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.2
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  dio: ^5.9.0
  pinput: ^5.0.2
  get: ^4.7.2
  flutter_smart_dialog: ^4.9.8+9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600

  assets:
    - assets/
    - assets/images/
    - assets/mp4/
    - assets/svg/

